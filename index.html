<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trail GPX Analyzer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --sidebar-bg: #f4f2ec;
      --sidebar-border: #ddd9ce;
      --text: #2c2c2c;
      --muted: #6b6560;
      --accent: #c62828;
      --accent-soft: #e57373;
      --flat: #9e9e9e;
      --run-hike: #2e7d32;
      --hike: #f9a825;
      --steep: #c62828;
      --chart-bg: #fff;
      --chart-grid: #e8e4db;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #e8e6e1;
      color: var(--text);
      line-height: 1.45;
      display: flex;
      flex-direction: column;
    }
    .app-header {
      flex-shrink: 0;
      padding: 0.5rem 1rem;
      background: #fff;
      border-bottom: 1px solid var(--sidebar-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .app-header h1 { font-size: 0.95rem; font-weight: 600; color: var(--muted); }
    .import-btn {
      display: inline-flex;
      align-items: center;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
    }
    .import-btn:hover { filter: brightness(1.06); }
    .import-btn input { display: none; }
    .import-btn.loading { opacity: 0.7; pointer-events: none; }
    .import-btn.secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--sidebar-border);
    }
    .app-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .main-layout {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    .bottom-charts {
      flex-shrink: 0;
      background: #fff;
      border-top: 1px solid var(--sidebar-border);
      padding: 0.6rem 1rem 0.75rem;
    }
    .bottom-charts .chart-label {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }
    .bottom-charts .chart-wrap {
      margin-bottom: 0.45rem;
    }
    .bottom-charts svg.profile { height: 150px; }
    .bottom-charts svg.grade-chart { height: 56px; }
    .map-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    #map { flex: 1; min-height: 0; width: 100%; background: #d4e8c8; }
    .sidebar {
      width: min(340px, 38vw);
      flex-shrink: 0;
      background: var(--sidebar-bg);
      border-left: 1px solid var(--sidebar-border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .sidebar-inner { padding: 1rem 1rem 1.25rem; }
    .route-title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 0.25rem;
    }
    .route-meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.75rem; }
    .method-note {
      font-size: 0.7rem;
      color: var(--muted);
      background: rgba(255,255,255,0.65);
      border: 1px solid var(--sidebar-border);
      border-radius: 6px;
      padding: 0.45rem 0.55rem;
      margin-bottom: 0.85rem;
      line-height: 1.4;
    }
    .hero-stat {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.15rem;
    }
    .hero-stat label {
      display: block;
      font-size: 0.68rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.1rem;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .stat-box {
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--sidebar-border);
      border-radius: 6px;
      padding: 0.45rem 0.55rem;
    }
    .stat-box label {
      display: block;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .stat-box span { font-size: 1rem; font-weight: 600; }
    .stat-box small { display: block; font-size: 0.62rem; color: var(--muted); margin-top: 0.1rem; }
    .section-stats {
      background: rgba(198, 40, 40, 0.08);
      border: 1px solid var(--accent-soft);
      border-radius: 6px;
      padding: 0.5rem 0.6rem;
      margin-bottom: 0.75rem;
      font-size: 0.78rem;
    }
    .section-stats[hidden] { display: none; }
    .section-stats strong { color: var(--accent); }
    .hover-readout {
      font-size: 0.75rem;
      color: var(--muted);
      min-height: 1.1rem;
      margin-bottom: 0.5rem;
    }
    .sidebar-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.75rem;
    }
    button.ghost {
      background: #fff;
      border: 1px solid var(--sidebar-border);
      color: var(--text);
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    button.ghost:hover { border-color: var(--accent); }
    .chart-wrap {
      background: var(--chart-bg);
      border: 1px solid var(--sidebar-border);
      border-radius: 6px;
      padding: 0.25rem 0.15rem 0.15rem;
    }
    svg.profile { width: 100%; display: block; cursor: crosshair; }
    svg.grade-chart { width: 100%; display: block; cursor: crosshair; }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 0.75rem;
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 0.35rem;
    }
    .legend i {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      margin-right: 0.2rem;
      vertical-align: -1px;
    }
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .empty-state p { color: var(--muted); margin-top: 0.75rem; max-width: 22rem; font-size: 0.9rem; }
    .empty-state .import-btn { margin-top: 1rem; }
    .error-banner {
      display: none;
      margin: 0 1rem;
      padding: 0.5rem 0.75rem;
      background: #ffebee;
      border: 1px solid var(--steep);
      border-radius: 6px;
      color: var(--steep);
      font-size: 0.82rem;
    }
    .error-banner.visible { display: block; }
    [hidden] { display: none !important; }
    .leaflet-control-zoom { border: none !important; box-shadow: 0 1px 4px rgba(0,0,0,0.2) !important; }
    @media (max-width: 720px) {
      .main-layout { flex-direction: column; }
      .sidebar { width: 100%; max-height: 38vh; border-left: none; border-bottom: 1px solid var(--sidebar-border); }
      #map { min-height: 38vh; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>Trail GPX Analyzer</h1>
    <label class="import-btn" id="import-label">
      Import GPX
      <input type="file" id="gpx-file" accept=".gpx,application/gpx+xml" />
    </label>
  </header>

  <p class="error-banner" id="error-banner" role="alert"></p>

  <section id="empty-state" class="empty-state">
    <p>Drop a race or trail GPX here. Everything runs in your browser — nothing is uploaded.</p>
    <label class="import-btn">
      Choose GPX file
      <input type="file" class="gpx-file-input" accept=".gpx,application/gpx+xml" />
    </label>
  </section>

  <div id="main-content" class="app-body" hidden>
    <div class="main-layout">
      <div class="map-panel">
        <div id="map"></div>
      </div>
      <aside class="sidebar">
        <div class="sidebar-inner">
          <h2 class="route-title" id="route-title">—</h2>
          <p class="route-meta" id="route-meta"></p>
          <p class="method-note" id="method-note"></p>

          <div class="hero-stat">
            <label>Distance</label>
            <span id="stat-distance">—</span>
          </div>
          <div class="stat-grid" id="stat-grid"></div>

          <div class="section-stats" id="section-stats" hidden></div>
          <p class="hover-readout" id="hover-readout"></p>

          <div class="sidebar-controls">
            <button type="button" class="ghost" id="reset-zoom">Reset section</button>
            <label class="import-btn secondary" style="padding:0.3rem 0.6rem;font-size:0.75rem">
              New GPX
              <input type="file" class="gpx-file-input" accept=".gpx,application/gpx+xml" />
            </label>
          </div>
        </div>
      </aside>
    </div>
    <div class="bottom-charts">
      <p class="chart-label">Elevation · drag to select a section · click faded area to reset</p>
      <div class="chart-wrap">
        <svg class="profile" id="elev-chart" aria-label="Elevation profile"></svg>
      </div>
      <p class="chart-label">Grade</p>
      <div class="chart-wrap">
        <svg class="grade-chart" id="grade-chart"></svg>
      </div>
      <div class="legend">
        <span><i style="background:var(--flat)"></i>Runnable (0–8%)</span>
        <span><i style="background:var(--run-hike)"></i>Run + hike (8–15%)</span>
        <span><i style="background:var(--hike)"></i>Hike (15–25%)</span>
        <span><i style="background:var(--steep)"></i>Steep (&gt;25%)</span>
      </div>
    </div>
  </div>

  <script src="gpx.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let THRESHOLD_M = 6;
    const GRADE_FLAT = 8;
    const GRADE_RUN_HIKE = 15;
    const GRADE_HIKE = 25;

    let route = null;
    let map, baseLine, routeLine, highlightLine, hoverMarker;
    let selStart = null, selEnd = null;
    let dragging = null;
    let focusStart = null, focusEnd = null;
    let hoverKm = null;
    let chartLayout = null;
    let interactionReady = false;

    const gradeColor = (g) => {
      const a = Math.abs(g);
      if (a < GRADE_FLAT) return "var(--flat)";
      if (a < GRADE_RUN_HIKE) return "var(--run-hike)";
      if (a < GRADE_HIKE) return "var(--hike)";
      return "var(--steep)";
    };

    function showError(msg) {
      document.getElementById("error-banner").textContent = msg;
      document.getElementById("error-banner").classList.add("visible");
    }
    function clearError() {
      document.getElementById("error-banner").classList.remove("visible");
    }

    function setLoading(loading) {
      const label = document.getElementById("import-label");
      label.classList.toggle("loading", loading);
      const t = label.childNodes[0];
      if (t?.nodeType === Node.TEXT_NODE) t.textContent = loading ? "Processing…" : "Import GPX";
    }

    function destroyMap() {
      if (map) { map.remove(); map = null; }
      baseLine = routeLine = highlightLine = hoverMarker = null;
      document.getElementById("map").innerHTML = "";
    }

    function routeKmBounds() {
      const km = route.profile.km;
      return { lo: km[0], hi: km[km.length - 1] };
    }

    function clampKm(km) {
      const { lo, hi } = routeKmBounds();
      return Math.max(lo, Math.min(hi, km));
    }

    function resetFocus() {
      focusStart = focusEnd = null;
      selStart = selEnd = null;
      renderSectionStats(null);
      drawCharts();
      updateMapHighlight();
      if (routeLine) routeLine.setStyle({ opacity: 1 });
    }

    function closestFullIndex(km) {
      const arr = route.full.km;
      let best = 0, bestD = Infinity;
      for (let i = 0; i < arr.length; i++) {
        const d = Math.abs(arr[i] - km);
        if (d < bestD) { bestD = d; best = i; }
      }
      return best;
    }

    function setHoverAtKm(km) {
      if (!route || !map) return;
      hoverKm = clampKm(km);
      const i = closestFullIndex(km);
      const lat = route.full.lat[i];
      const lon = route.full.lon[i];
      const ele = route.full.elevation_m[i];
      const grade = route.full.grade_pct[i];

      if (!hoverMarker) {
        hoverMarker = L.circleMarker([lat, lon], {
          radius: 9,
          color: "#fff",
          weight: 3,
          fillColor: "#c62828",
          fillOpacity: 1,
          interactive: false,
        }).addTo(map);
      } else {
        hoverMarker.setLatLng([lat, lon]);
      }

      document.getElementById("hover-readout").textContent =
        `${hoverKm.toFixed(2)} km · ${Math.round(ele)} m · ${grade >= 0 ? "+" : ""}${grade.toFixed(1)}%`;

      drawCharts();
    }

    function clearHover() {
      hoverKm = null;
      if (hoverMarker) {
        map.removeLayer(hoverMarker);
        hoverMarker = null;
      }
      document.getElementById("hover-readout").textContent = "";
      drawCharts();
    }

    function renderGlobalStats() {
      const s = route.summary;
      document.getElementById("route-title").textContent = route.name;
      document.getElementById("route-meta").textContent = route.source_gpx;
      document.getElementById("method-note").textContent =
        `Elevation gain uses ${route.method.label} to filter GPS noise. Values are comparable across tracks; raw GPX sums are often much higher.`;
      document.getElementById("stat-distance").textContent =
        `${Number(s.distance_km).toFixed(1)} km`;
      document.getElementById("stat-grid").innerHTML = `
        <div class="stat-box"><label>↑ Gain</label><span>${Math.round(s.elevation_gain_m)} m</span></div>
        <div class="stat-box"><label>↓ Loss</label><span>${Math.round(s.elevation_loss_m)} m</span></div>
        <div class="stat-box"><label>Min elev</label><span>${Math.round(s.min_elevation_m)} m</span></div>
        <div class="stat-box"><label>Max elev</label><span>${Math.round(s.max_elevation_m)} m</span></div>
      `;
    }

    function renderSectionStats(seg) {
      const el = document.getElementById("section-stats");
      if (!seg) { el.hidden = true; return; }
      el.hidden = false;
      el.innerHTML = `<strong>Section</strong> ${seg.start_km}–${seg.end_km} km · ` +
        `${seg.distance_km.toFixed(2)} km · ↑${seg.gain_m} m ↓${seg.loss_m} m · ` +
        `avg ${seg.avg_grade_pct}% · max ${seg.max_grade_up_pct}% / ${seg.max_grade_down_pct}%`;
    }

    function applyRoute(data) {
      clearError();
      route = data;
      THRESHOLD_M = route.method?.threshold_m ?? 6;
      selStart = selEnd = null;
      focusStart = focusEnd = null;
      hoverKm = null;

      document.getElementById("empty-state").hidden = true;
      document.getElementById("main-content").hidden = false;

      renderGlobalStats();
      renderSectionStats(null);
      destroyMap();
      initMap();
      drawCharts();
      if (!interactionReady) {
        setupInteraction();
        interactionReady = true;
      }
      document.getElementById("reset-zoom").onclick = resetFocus;
    }

    function handleGpxFile(file) {
      if (!file) return;
      if (!/\.gpx$/i.test(file.name)) { showError("Please choose a .gpx file."); return; }
      clearError();
      setLoading(true);
      const reader = new FileReader();
      reader.onload = () => {
        try {
          applyRoute(GpxAnalyzer.buildRouteFromGpx(reader.result, file.name));
        } catch (e) {
          showError(e.message || "Could not parse GPX.");
        } finally {
          setLoading(false);
        }
      };
      reader.onerror = () => { setLoading(false); showError("Could not read file."); };
      reader.readAsText(file);
    }

    function bindFileInput(input) {
      if (!input) return;
      input.addEventListener("change", (e) => {
        handleGpxFile(e.target.files[0]);
        e.target.value = "";
      });
    }
    document.querySelectorAll(".gpx-file-input").forEach(bindFileInput);
    bindFileInput(document.getElementById("gpx-file"));
    (function bindDrop() {
      const el = document.getElementById("empty-state");
      el.addEventListener("dragover", (e) => { e.preventDefault(); });
      el.addEventListener("drop", (e) => {
        e.preventDefault();
        const f = e.dataTransfer?.files?.[0];
        if (f) handleGpxFile(f);
      });
    })();

    function thresholdGainLoss(eles, threshold) {
      let gain = 0, loss = 0, rMin = eles[0], rMax = eles[0];
      for (const e of eles) {
        if (e < rMin) rMin = e;
        if (e - rMin >= threshold) { gain += e - rMin; rMin = e; }
        if (e > rMax) rMax = e;
        if (rMax - e >= threshold) { loss += rMax - e; rMax = e; }
      }
      return { gain, loss };
    }

    function segmentStats(km0, km1) {
      km0 = clampKm(km0);
      km1 = clampKm(km1);
      if (km1 < km0) [km0, km1] = [km1, km0];
      const fullKm = route.full.km, fullEle = route.full.elevation_m;
      let i0 = fullKm.findIndex((k) => k >= km0);
      if (i0 < 0) i0 = fullKm.length - 1;
      let i1 = fullKm.length - 1;
      while (i1 > i0 && fullKm[i1] > km1) i1--;
      const eles = fullEle.slice(i0, i1 + 1);
      const { gain, loss } = thresholdGainLoss(eles, THRESHOLD_M);
      const dist = km1 - km0;
      const grades = route.full.grade_pct.slice(i0 + 1, i1 + 1);
      const maxUp = grades.length ? Math.max(0, ...grades.filter((g) => g > 0)) : 0;
      const maxDown = grades.length ? Math.min(0, ...grades.filter((g) => g < 0)) : 0;
      const elevDelta = eles.length >= 2 ? eles[eles.length - 1] - eles[0] : 0;
      const avgGrade = dist > 0 ? (elevDelta / (dist * 1000)) * 100 : 0;
      return {
        distance_km: dist, gain_m: Math.round(gain), loss_m: Math.round(loss),
        avg_grade_pct: +avgGrade.toFixed(1),
        max_grade_up_pct: +maxUp.toFixed(1), max_grade_down_pct: +maxDown.toFixed(1),
        start_km: +km0.toFixed(2), end_km: +km1.toFixed(2),
      };
    }

    function initMap() {
      const coords = route.profile.lat.map((lat, i) => [lat, route.profile.lon[i]]);
      map = L.map("map", { zoomControl: false });
      L.control.zoom({ position: "bottomright" }).addTo(map);

      // Mapy.cz outdoor/hiking style (similar to mapy.com tourist map)
      const mapy = L.tileLayer(
        "https://mapserver.mapy.cz/turist-m/{z}-{x}-{y}",
        {
          attribution: '<a href="https://api.mapy.cz/copyright" target="_blank">Mapy.cz</a>',
          maxZoom: 18,
        }
      );
      const fallback = L.tileLayer(
        "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
        { attribution: "&copy; OpenTopoMap", maxZoom: 17 }
      );
      mapy.on("tileerror", () => {
        if (!map.hasLayer(fallback)) fallback.addTo(map);
      });
      mapy.addTo(map);

      baseLine = L.polyline(coords, {
        color: "#fff", weight: 8, opacity: 0.9, lineCap: "round", lineJoin: "round",
      }).addTo(map);
      routeLine = L.polyline(coords, {
        color: "#c62828", weight: 5, opacity: 1, lineCap: "round", lineJoin: "round",
      }).addTo(map);
      highlightLine = L.polyline([], {
        color: "#ff6f00", weight: 7, opacity: 1, lineCap: "round",
      }).addTo(map);

      map.fitBounds(routeLine.getBounds(), { padding: [32, 32] });

      map.on("mousemove", (e) => {
        if (dragging) return;
        let best = 0, bestM = Infinity;
        const full = route.full;
        for (let i = 0; i < full.lat.length; i++) {
          const m = map.distance(e.latlng, L.latLng(full.lat[i], full.lon[i]));
          if (m < bestM) { bestM = m; best = i; }
        }
        if (bestM > 120) { clearHover(); return; }
        setHoverAtKm(full.km[best]);
      });
      map.on("mouseout", () => { if (!dragging) clearHover(); });
    }

    function updateMapHighlight() {
      if (!highlightLine) return;
      const { km, lat, lon } = route.profile;
      const start = focusStart ?? selStart;
      const end = focusEnd ?? selEnd;
      if (start == null || end == null) {
        highlightLine.setLatLngs([]);
        routeLine.setStyle({ opacity: 1 });
        return;
      }
      const a = Math.min(start, end), b = Math.max(start, end);
      const seg = [];
      for (let i = 0; i < km.length; i++) {
        if (km[i] >= a && km[i] <= b) seg.push([lat[i], lon[i]]);
      }
      highlightLine.setLatLngs(seg);
      routeLine.setStyle({ opacity: 0.55 });
    }

    function chartRange() {
      const km = route.profile.km;
      return { minK: km[0], maxK: km[km.length - 1] };
    }

    const FOCUS_WIDTH_RATIO = 0.85;

    function getFocusBounds() {
      if (focusStart == null || focusEnd == null) return null;
      const a = Math.min(focusStart, focusEnd);
      const b = Math.max(focusStart, focusEnd);
      if (b - a < 0.3) return null;
      return { a, b };
    }

    function buildChartScales(minK, maxK, pad, W, useFocus) {
      const plotW = W - pad.l - pad.r;
      const fb = useFocus ? getFocusBounds() : null;
      if (!fb) {
        const xScale = (k) => pad.l + ((k - minK) / (maxK - minK)) * plotW;
        const kmFromX = (x) => {
          const frac = Math.max(0, Math.min(1, (x - pad.l) / plotW));
          return minK + frac * (maxK - minK);
        };
        return { xScale, kmFromX, focused: false, pad, plotW };
      }
      const { a: fa, b: fEnd } = fb;
      const leftLen = fa - minK;
      const rightLen = maxK - fEnd;
      const focusLen = fEnd - fa;
      const focusW = plotW * FOCUS_WIDTH_RATIO;
      const edgeW = plotW - focusW;
      const totalEdge = leftLen + rightLen;
      const leftW = totalEdge > 1e-6 ? edgeW * (leftLen / totalEdge) : edgeW * 0.5;
      const rightW = edgeW - leftW;

      const xScale = (k) => {
        if (k <= fa) {
          if (leftLen < 1e-6) return pad.l;
          return pad.l + ((k - minK) / leftLen) * leftW;
        }
        if (k <= fEnd) {
          if (focusLen < 1e-6) return pad.l + leftW;
          return pad.l + leftW + ((k - fa) / focusLen) * focusW;
        }
        if (rightLen < 1e-6) return pad.l + leftW + focusW;
        return pad.l + leftW + focusW + ((k - fEnd) / rightLen) * rightW;
      };

      const kmFromX = (x) => {
        if (x <= pad.l + leftW) {
          if (leftW < 1e-6) return minK;
          return minK + ((x - pad.l) / leftW) * leftLen;
        }
        if (x <= pad.l + leftW + focusW) {
          if (focusW < 1e-6) return fa;
          return fa + ((x - pad.l - leftW) / focusW) * focusLen;
        }
        if (rightW < 1e-6) return fEnd;
        return fEnd + ((x - pad.l - leftW - focusW) / rightW) * rightLen;
      };

      return { xScale, kmFromX, focused: true, fa, fEnd, leftW, focusW, pad, plotW };
    }

    function segmentOpacity(km) {
      const fb = getFocusBounds();
      if (!fb) return 1;
      if (km >= fb.a && km <= fb.b) return 1;
      return 0.3;
    }

    function eventX(svg, evt, layout) {
      const rect = svg.getBoundingClientRect();
      const vb = svg.viewBox.baseVal;
      return ((evt.clientX - rect.left) / rect.width) * vb.width;
    }

    function drawCharts() {
      if (!route) return;
      const prof = route.profile;
      const { minK, maxK } = chartRange();
      const pad = { l: 40, r: 8, t: 6, b: 18 };
      const W = document.getElementById("elev-chart").clientWidth || 800;
      const H = 150;

      const indices = prof.km.map((k, i) => i).filter((i) => prof.km[i] >= minK && prof.km[i] <= maxK);
      if (indices.length < 2) return;

      const eles = indices.map((i) => prof.elevation_m[i]);
      const eleMin = Math.min(...eles) - 15;
      const eleMax = Math.max(...eles) + 15;
      const gradeMin = -30, gradeMax = 30;

      const useFocus = !dragging && getFocusBounds() != null;
      const scales = buildChartScales(minK, maxK, pad, W, useFocus);
      const { xScale, kmFromX } = scales;
      const yScale = (e) => pad.t + (1 - (e - eleMin) / (eleMax - eleMin)) * (H - pad.t - pad.b);
      const yG = (g) => pad.t + (1 - (g - gradeMin) / (gradeMax - gradeMin)) * (48 - pad.t - 12);
      chartLayout = { pad, minK, maxK, W, H, xScale, kmFromX, scales };

      const elevSvg = document.getElementById("elev-chart");
      elevSvg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      let svg = `<rect width="${W}" height="${H}" fill="#fff"/>`;
      for (let e = Math.ceil(eleMin / 100) * 100; e <= eleMax; e += 100) {
        const y = yScale(e);
        svg += `<line x1="${pad.l}" y1="${y}" x2="${W - pad.r}" y2="${y}" stroke="#e8e4db"/>`;
        svg += `<text x="${pad.l - 4}" y="${y + 3}" fill="#8a847a" font-size="8" text-anchor="end">${e}</text>`;
      }
      const kmLabels = scales.focused
        ? [minK, scales.fa, scales.fEnd, maxK]
        : (() => {
            const step = maxK - minK > 30 ? 10 : 5;
            const labels = [];
            for (let k = Math.ceil(minK / step) * step; k <= maxK; k += step) labels.push(k);
            return labels;
          })();
      const seen = new Set();
      for (const k of kmLabels) {
        const key = k.toFixed(1);
        if (seen.has(key)) continue;
        seen.add(key);
        svg += `<text x="${xScale(k)}" y="${H - 4}" fill="#8a847a" font-size="8" text-anchor="middle">${k.toFixed(1)}</text>`;
      }
      if (scales.focused) {
        const h = H - pad.t - pad.b;
        const xEdgeR = pad.l + scales.leftW + scales.focusW;
        svg += `<rect x="${pad.l}" y="${pad.t}" width="${scales.leftW}" height="${h}" fill="#f5f3ee" opacity="0.72"/>`;
        svg += `<rect x="${xEdgeR}" y="${pad.t}" width="${scales.plotW - scales.leftW - scales.focusW}" height="${h}" fill="#f5f3ee" opacity="0.72"/>`;
      }
      for (let j = 0; j < indices.length - 1; j++) {
        const i = indices[j], i2 = indices[j + 1];
        const g = prof.grade_pct[i2];
        const c = gradeColor(g);
        const flat = c === "var(--flat)";
        const mid = (prof.km[i] + prof.km[i2]) / 2;
        const op = (flat ? 0.5 : 1) * segmentOpacity(mid);
        svg += `<line x1="${xScale(prof.km[i])}" y1="${yScale(prof.elevation_m[i])}" ` +
          `x2="${xScale(prof.km[i2])}" y2="${yScale(prof.elevation_m[i2])}" ` +
          `stroke="${c}" stroke-width="${flat ? 1.8 : 2.2}" stroke-linecap="round" opacity="${op}"/>`;
      }
      if (hoverKm != null && hoverKm >= minK && hoverKm <= maxK) {
        const hx = xScale(hoverKm);
        svg += `<line x1="${hx}" y1="${pad.t}" x2="${hx}" y2="${H - pad.b}" stroke="#c62828" stroke-width="1.5" opacity="0.85"/>`;
        const hi = closestFullIndex(hoverKm);
        const hy = yScale(route.full.elevation_m[hi]);
        svg += `<circle cx="${hx}" cy="${hy}" r="4" fill="#c62828" stroke="#fff" stroke-width="1.5"/>`;
      }
      const dragScale = dragging
        ? buildChartScales(minK, maxK, pad, W, false).xScale
        : xScale;
      const selA = dragging ? selStart : (getFocusBounds()?.a ?? null);
      const selB = dragging ? selEnd : (getFocusBounds()?.b ?? null);
      if (selA != null && selB != null) {
        const a = Math.min(selA, selB), b = Math.max(selA, selB);
        const xs = dragging ? dragScale : xScale;
        const x1 = xs(a), x2 = xs(b);
        svg += `<rect x="${x1}" y="${pad.t}" width="${x2 - x1}" height="${H - pad.t - pad.b}" fill="#c62828" opacity="0.12"/>`;
        svg += `<line x1="${x1}" y1="${pad.t}" x2="${x1}" y2="${H - pad.b}" stroke="#c62828" stroke-width="2"/>`;
        svg += `<line x1="${x2}" y1="${pad.t}" x2="${x2}" y2="${H - pad.b}" stroke="#c62828" stroke-width="2"/>`;
      }
      elevSvg.innerHTML = svg;

      const gradeSvg = document.getElementById("grade-chart");
      gradeSvg.setAttribute("viewBox", `0 0 ${W} 48`);
      let gsvg = `<rect width="${W}" height="48" fill="#fff"/>`;
      gsvg += `<line x1="${pad.l}" y1="${yG(0)}" x2="${W - pad.r}" y2="${yG(0)}" stroke="#ccc" stroke-dasharray="3"/>`;
      for (let j = 0; j < indices.length - 1; j++) {
        const i = indices[j], i2 = indices[j + 1];
        const x1 = xScale(prof.km[i]), x2 = xScale(prof.km[i2]);
        const g = prof.grade_pct[i2];
        const y0 = yG(0), y1 = yG(g);
        const c = gradeColor(g);
        const mid = (prof.km[i] + prof.km[i2]) / 2;
        const op = (c === "var(--flat)" ? 0.4 : 0.85) * segmentOpacity(mid);
        gsvg += `<rect x="${x1}" y="${Math.min(y0, y1)}" width="${Math.max(1, x2 - x1)}" height="${Math.abs(y1 - y0)}" fill="${c}" opacity="${op}"/>`;
      }
      if (scales.focused) {
        const xEdgeR = pad.l + scales.leftW + scales.focusW;
        gsvg += `<rect x="${pad.l}" y="${pad.t}" width="${scales.leftW}" height="40" fill="#f5f3ee" opacity="0.72"/>`;
        gsvg += `<rect x="${xEdgeR}" y="${pad.t}" width="${scales.plotW - scales.leftW - scales.focusW}" height="40" fill="#f5f3ee" opacity="0.72"/>`;
      }
      if (hoverKm != null && hoverKm >= minK && hoverKm <= maxK) {
        gsvg += `<line x1="${xScale(hoverKm)}" y1="${pad.t}" x2="${xScale(hoverKm)}" y2="44" stroke="#c62828" stroke-width="1.5" opacity="0.85"/>`;
      }
      gradeSvg.innerHTML = gsvg;
    }

    function kmFromEvent(svg, evt) {
      const layout = chartLayout;
      if (!layout) return 0;
      const x = eventX(svg, evt, layout);
      const km = layout.kmFromX(x);
      return route ? clampKm(km) : km;
    }

    function setupInteraction() {
      const onChartMove = (svg, e) => {
        if (dragging || !route) return;
        setHoverAtKm(kmFromEvent(svg, e));
      };
      const elev = document.getElementById("elev-chart");
      const grade = document.getElementById("grade-chart");
      elev.addEventListener("mousemove", (e) => onChartMove(elev, e));
      grade.addEventListener("mousemove", (e) => onChartMove(grade, e));
      elev.addEventListener("mouseleave", () => { if (!dragging) clearHover(); });
      grade.addEventListener("mouseleave", () => { if (!dragging) clearHover(); });

      const startSelect = (svg, e) => {
        const layout = chartLayout;
        const { minK, maxK } = chartRange();
        const pad = layout?.pad ?? { l: 40, r: 8, t: 6, b: 18 };
        const W = layout?.W ?? 800;
        const x = eventX(svg, e, layout || { pad, W });

        if (layout?.scales?.focused) {
          const { leftW, focusW } = layout.scales;
          const inFocusBand = x >= pad.l + leftW && x <= pad.l + leftW + focusW;
          if (!inFocusBand) {
            resetFocus();
            return;
          }
          focusStart = focusEnd = null;
        }

        dragging = "select";
        const linear = buildChartScales(minK, maxK, pad, W, false);
        selStart = selEnd = clampKm(linear.kmFromX(x));
        drawCharts();
      };
      elev.addEventListener("mousedown", (e) => startSelect(elev, e));
      grade.addEventListener("mousedown", (e) => startSelect(grade, e));

      window.addEventListener("mousemove", (e) => {
        if (!dragging || !route) return;
        selEnd = clampKm(kmFromEvent(elev, e));
        const a = Math.min(selStart, selEnd), b = Math.max(selStart, selEnd);
        renderSectionStats(segmentStats(a, b));
        drawCharts();
        updateMapHighlight();
      });
      window.addEventListener("mouseup", () => {
        if (!dragging || !route) return;
        dragging = null;
        if (selStart != null && selEnd != null) {
          const a = clampKm(Math.min(selStart, selEnd));
          const b = clampKm(Math.max(selStart, selEnd));
          selStart = a;
          selEnd = b;
          if (b - a > 0.3) {
            focusStart = a;
            focusEnd = b;
          }
          renderSectionStats(segmentStats(a, b));
          drawCharts();
          updateMapHighlight();
        }
      });
      window.addEventListener("resize", () => drawCharts());
    }
  </script>
</body>
</html>
